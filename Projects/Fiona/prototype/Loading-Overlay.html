<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FinOps — Loading</title>
<style>
  /* ============================================================
     MET-DS-V2 tokens
     ============================================================ */
  :root {
    --color-brand-primary: #3276CF;
    --color-brand-deep:    #1F3C88;
    --color-brand-cyan:    #03A9F4;
    --color-brand-aqua:    #56AAC4;
    --color-page-bg:       #F2F5FA;
    --color-card-bg:       #FFFFFF;
    --color-text-body:     #212121;
    --color-text-muted:    #5B6B82;
    --color-border:        #E2E8F0;

    --radius-card: 8px;

    --space-4: 4px;  --space-8: 8px;   --space-12: 12px;
    --space-16: 16px; --space-20: 20px; --space-24: 24px;
    --space-32: 32px; --space-40: 40px; --space-48: 48px;

    --font-base: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    font-family: var(--font-base);
    color: var(--color-text-body);
    background:
      radial-gradient(1200px 600px at 20% 20%, rgba(50, 118, 207, 0.08), transparent 60%),
      radial-gradient(900px 500px at 80% 80%, rgba(3, 169, 244, 0.08), transparent 60%),
      var(--color-page-bg);
  }

  /* Sample page beneath the overlay */
  .page {
    max-width: 960px;
    margin: 0 auto;
    padding: var(--space-32) var(--space-24);
  }
  .page h1 {
    font-size: 24px;
    font-weight: 600;
    color: var(--color-brand-deep);
    margin: 0 0 var(--space-8);
  }
  .page p {
    margin: 0 0 var(--space-16);
    color: var(--color-text-muted);
    font-size: 14px;
    line-height: 1.5;
  }
  .card {
    background: var(--color-card-bg);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-card);
    padding: var(--space-20);
    margin-bottom: var(--space-16);
  }

  /* ============================================================
     FULL-PAGE LOADING OVERLAY
     Keeps the existing page content visible behind a soft blur.
     ============================================================ */
  .fi-overlay {
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: rgba(31, 60, 136, 0.18);
    backdrop-filter: blur(6px) saturate(120%);
    -webkit-backdrop-filter: blur(6px) saturate(120%);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 1;
    visibility: visible;
    transition: opacity 600ms ease, visibility 0s linear 600ms;
  }
  .fi-overlay.is-hidden {
    opacity: 0;
    visibility: hidden;
  }

  .fi-stage {
    position: relative;
    width: 140px;
    height: 140px;
    display: flex;
    align-items: center;
    justify-content: center;
    perspective: 800px;          /* enables 3D flip on children */
    perspective-origin: 50% 50%;
  }

  /* Both glyphs stack inside the orbit and swap with a 3D coin flip.
     The active glyph rotates from -90deg ? 0deg while the outgoing
     glyph rotates 0deg ? 90deg — like two faces of a spinning coin. */
  .fi-glyph {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    backface-visibility: hidden;
    transform-style: preserve-3d;
    transition:
      opacity   900ms cubic-bezier(0.65, 0, 0.35, 1),
      transform 900ms cubic-bezier(0.65, 0, 0.35, 1),
      filter    900ms cubic-bezier(0.65, 0, 0.35, 1);
    will-change: opacity, transform, filter;
  }

  /* Default state: Fi is visible, £ is flipped away to the right */
  .fi-glyph--fi {
    opacity: 1;
    transform: rotateY(0deg) scale(1);
    filter: blur(0);
  }
  .fi-glyph--pound {
    opacity: 0;
    transform: rotateY(90deg) scale(0.9);
    filter: blur(6px);
  }

  /* Morphed state: £ flips into view, Fi flips out to the left */
  .fi-overlay.is-morphed .fi-glyph--fi {
    opacity: 0;
    transform: rotateY(-90deg) scale(0.9);
    filter: blur(6px);
  }
  .fi-overlay.is-morphed .fi-glyph--pound {
    opacity: 1;
    transform: rotateY(0deg) scale(1);
    filter: blur(0);
  }

  /* Tiny shimmer pass that runs every time the disc flips */
  .fi-disc::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: linear-gradient(115deg,
      transparent 30%,
      rgba(255, 255, 255, 0.55) 50%,
      transparent 70%);
    transform: translateX(-120%);
    pointer-events: none;
  }
  .fi-overlay.is-flipping .fi-disc::after {
    animation: discShimmer 900ms ease-out;
  }
  @keyframes discShimmer {
    0%   { transform: translateX(-120%); opacity: 0;   }
    20%  { opacity: 1; }
    100% { transform: translateX(120%);  opacity: 0;   }
  }

  /* "Fi" SVG — F + i stem + 2 accent dots, lifted from images/FinOps-Logo.svg.
     Sized so the whole mark sits inside the spinning circle.
     Height is matched to the pound glyph's visual cap-height for parity. */
  .fi-svg {
    width: auto;
    height: 56px;
    display: block;
    overflow: visible;
  }
  .fi-svg .fi-f {
    transform-box: fill-box;
    transform-origin: center;
    animation: fiFade 2.2s ease-in-out infinite;
  }
  .fi-svg .fi-stem {
    transform-box: fill-box;
    transform-origin: center bottom;
    animation: fiStem 1.6s ease-in-out infinite;
  }
  .fi-svg .fi-dot1,
  .fi-svg .fi-dot2 {
    transform-box: fill-box;
    transform-origin: center;
    animation: fiDot 1.4s ease-in-out infinite;
  }
  .fi-svg .fi-dot1 { animation-delay: 0ms; }
  .fi-svg .fi-dot2 { animation-delay: 220ms; }

  @keyframes fiFade {
    0%, 100% { opacity: 1;    }
    50%      { opacity: 0.85; }
  }
  @keyframes fiStem {
    0%, 100% { transform: scaleY(1);    }
    50%      { transform: scaleY(1.05); }
  }
  @keyframes fiDot {
    0%, 100% { transform: translateY(0)    scale(1);    opacity: 0.95; }
    50%      { transform: translateY(-3px) scale(1.15); opacity: 1;    }
  }

  /* Pound mark — font-size tuned so the visible glyph height matches the Fi SVG */
  .fi-pound {
    font-family: var(--font-base);
    font-size: 80px;
    line-height: 1;
    font-weight: 600;
    letter-spacing: -0.02em;
    background: linear-gradient(180deg,
      var(--color-brand-deep)    0%,
      var(--color-brand-primary) 60%,
      var(--color-brand-cyan)    100%);
    -webkit-background-clip: text;
            background-clip: text;
    -webkit-text-fill-color: transparent;
    color: var(--color-brand-deep);
    animation: poundPulse 1.8s ease-in-out infinite;
  }
  @keyframes poundPulse {
    0%, 100% { transform: scale(1);    }
    50%      { transform: scale(1.04); }
  }

  /* Loading circle — Fi / £ sit INSIDE this ring.
     A soft white disc gives the glyphs a clean backdrop. */
  .fi-disc {
    position: absolute;
    inset: 12px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.35);
    box-shadow:
      0 12px 32px rgba(15, 34, 78, 0.18),
      0 2px 8px  rgba(15, 34, 78, 0.10);
    overflow: hidden;
  }
  .fi-orbit {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 3px solid transparent;
    border-top-color: var(--color-brand-primary);
    border-right-color: var(--color-brand-cyan);
    animation: spin 1.8s linear infinite;
  }
  .fi-orbit + .fi-orbit {
    inset: 6px;
    border-width: 2px;
    border-top-color: transparent;
    border-right-color: transparent;
    border-bottom-color: var(--color-brand-aqua);
    border-left-color: var(--color-brand-deep);
    opacity: 0.55;
    animation: spin 2.8s linear infinite reverse;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Accessibility — reduced motion */
  @media (prefers-reduced-motion: reduce) {
    .fi-svg .fi-f,
    .fi-svg .fi-stem,
    .fi-svg .fi-dot1,
    .fi-svg .fi-dot2,
    .fi-pound,
    .fi-orbit,
    .fi-glyph,
    .fi-overlay {
      animation: none !important;
      transition: opacity 200ms ease !important;
    }
  }
</style>
</head>
<body>
  <!-- Sample page content sitting under the overlay -->
  <main class="page">
    <article class="card">
      <h1>Dashboard</h1>
      <p>This is the underlying page. The full-screen FinOps loader covers it for 30 seconds while data is fetched, then fades away.</p>
    </article>
    <article class="card">
      <p>Refresh the page to replay the loading sequence.</p>
    </article>
  </main>

  <!-- =========================================================
       Full-page loading overlay (auto-shown on page open)
       ========================================================= -->
  <div class="fi-overlay" id="fiOverlay" role="status" aria-live="polite" aria-label="Loading">
    <div class="fi-stage">
      <span class="fi-disc"  aria-hidden="true"></span>
      <span class="fi-orbit" aria-hidden="true"></span>
      <span class="fi-orbit" aria-hidden="true"></span>

      <!-- Glyph 1: "Fi" lifted from images/FinOps-Logo.svg -->
      <div class="fi-glyph fi-glyph--fi" aria-hidden="true">
        <svg class="fi-svg" viewBox="0 -1 25 35" xmlns="http://www.w3.org/2000/svg" focusable="false">
          <!-- F -->
          <path class="fi-f"
                d="M0.546157 32.2806C0.189968 31.9482 0 31.5089 0 30.9865V12.1797C0.0237459 11.7166 0.166223 11.313 0.439301 10.9805C0.759871 10.5768 1.24666 10.375 1.87593 10.375H12.2291C12.7397 10.375 13.179 10.565 13.547 10.933C13.7014 11.0993 13.832 11.3011 13.927 11.5267C14.022 11.7523 14.0695 12.0016 14.0695 12.2391C14.0695 12.7615 13.8914 13.2008 13.547 13.5688C13.179 13.9369 12.7397 14.1269 12.2291 14.1269H3.75185V20.5383H9.70021C10.2345 20.5383 10.6738 20.7163 11.03 21.0725C11.3862 21.4287 11.5761 21.868 11.5761 22.3904C11.5761 22.9128 11.398 23.3403 11.03 23.6727C10.6738 24.0052 10.2226 24.1832 9.70021 24.1832H3.75185V30.9746C3.75185 31.5089 3.57376 31.96 3.21757 32.3044C2.86138 32.6487 2.41021 32.8149 1.87593 32.8149C1.35352 32.8268 0.902345 32.6487 0.546157 32.2806Z"
                fill="#1F3C88"/>
          <!-- i stem -->
          <path class="fi-stem"
                d="M16.5982 32.2806C16.2183 31.9244 16.0283 31.4851 16.0283 30.9627V18.2586C16.0283 18.0093 16.0758 17.7718 16.1827 17.5462C16.2895 17.3206 16.4201 17.1188 16.6101 16.9526C16.7763 16.7863 16.9782 16.6439 17.2156 16.5489C17.4531 16.442 17.7024 16.3945 17.9636 16.3945C18.4741 16.3945 18.9134 16.5845 19.2815 16.9526C19.4359 17.1188 19.5665 17.3206 19.6614 17.5462C19.7564 17.7718 19.8039 18.0211 19.8039 18.2586V30.9745C19.8039 31.4969 19.6258 31.9362 19.2696 32.2924C18.9134 32.6486 18.4741 32.8267 17.9517 32.8267C17.4056 32.8267 16.9663 32.6486 16.5982 32.2806Z"
                fill="#03A9F4"/>
          <!-- i lower accent dot -->
          <path class="fi-dot1"
                d="M20.9913 16.4885C20.6114 16.1324 20.4214 15.6931 20.4214 15.1706V7.2039C20.4214 6.95457 20.4689 6.71711 20.5757 6.49152C20.6826 6.26593 20.8132 6.06409 21.0032 5.89787C21.1694 5.73165 21.3712 5.58918 21.6087 5.49419C21.8461 5.38734 22.0955 5.33984 22.3567 5.33984C22.8672 5.33984 23.3065 5.52981 23.6746 5.89787C23.8289 6.06409 23.9595 6.26593 24.0545 6.49152C24.1495 6.71711 24.197 6.96644 24.197 7.2039V15.1706C24.197 15.6931 24.0189 16.1324 23.6627 16.4885C23.3065 16.8447 22.8672 17.0228 22.3448 17.0228C21.7986 17.0347 21.3593 16.8566 20.9913 16.4885Z"
                fill="#56AAC4"/>
          <!-- i upper accent dot -->
          <path class="fi-dot2"
                d="M15.7672 14.7106C15.3872 14.3544 15.1973 13.9151 15.1973 13.3927V1.86405C15.1973 1.61472 15.2448 1.37726 15.3516 1.15168C15.4585 0.92609 15.5891 0.72425 15.779 0.558029C15.9453 0.391807 16.1471 0.249332 16.3846 0.154349C16.622 0.0474922 16.8714 0 17.1326 0C17.6431 0 18.0824 0.189967 18.4505 0.558029C18.6048 0.72425 18.7354 0.92609 18.8304 1.15168C18.9254 1.37726 18.9729 1.62659 18.9729 1.86405V13.3927C18.9729 13.9151 18.7948 14.3544 18.4386 14.7106C18.0824 15.0668 17.6431 15.2449 17.1207 15.2449C16.5745 15.2568 16.1352 15.0787 15.7672 14.7106Z"
                fill="#1F3C88"/>
        </svg>
      </div>

      <!-- Glyph 2: Pound symbol -->
      <div class="fi-glyph fi-glyph--pound" aria-hidden="true">
        <span class="fi-pound">&pound;</span>
      </div>
    </div>
  </div>

  <script>
    /* ============================================================
       Auto-show on page open for 30 seconds.
       Inside the loader the glyph alternates every 2.5 seconds with
       a 3D coin-flip + blur + shimmer transition:
         0s    : Fi
         2.5s  : flip ? £
         5s    : flip ? Fi
         7.5s  : flip ? £   … (continues until hide)
         30s   : Overlay fades out
       ============================================================ */
    (function () {
      const TOTAL_MS = 30000;
      const SWAP_MS  = 2500;
      const FLIP_MS  = 900;   // must match the CSS transition duration
      const overlay  = document.getElementById('fiOverlay');
      if (!overlay) return;

      // Block background scroll while loading
      const prevOverflow = document.body.style.overflow;
      document.body.style.overflow = 'hidden';

      // Alternate Fi ? £ every 2.5 seconds, with a shimmer pulse on each swap
      const swapInterval = setInterval(() => {
        overlay.classList.add('is-flipping');
        overlay.classList.toggle('is-morphed');
        setTimeout(() => overlay.classList.remove('is-flipping'), FLIP_MS);
      }, SWAP_MS);

      // Hide after 30 seconds
      setTimeout(() => {
        clearInterval(swapInterval);
        overlay.classList.add('is-hidden');
        document.body.style.overflow = prevOverflow;
      }, TOTAL_MS);
    })();
  </script>
<!-- content-protection:v1 -->
<script>
(function initContentProtection() {
  if (window.__contentProtectionInitialized) {
    return;
  }
  window.__contentProtectionInitialized = true;

  document.addEventListener('contextmenu', function (event) {
    event.preventDefault();
  }, true);

  document.addEventListener('dragstart', function (event) {
    var target = event.target;
    if (target && target.tagName && target.tagName.toUpperCase() === 'IMG') {
      event.preventDefault();
    }
  }, true);

  document.addEventListener('keydown', function (event) {
    var key = String(event.key || '').toUpperCase();
    var ctrlOrMeta = event.ctrlKey || event.metaKey;
    var blocked = false;

    if (key === 'F12') {
      blocked = true;
    } else if (ctrlOrMeta && event.shiftKey && (key === 'I' || key === 'J' || key === 'C' || key === 'K')) {
      blocked = true;
    } else if (ctrlOrMeta && (key === 'U' || key === 'S')) {
      blocked = true;
    }

    if (blocked) {
      event.preventDefault();
      event.stopPropagation();
    }
  }, true);
})();
</script>
</body>
</html>
