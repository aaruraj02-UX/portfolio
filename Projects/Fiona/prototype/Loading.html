<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FinOps — Loading</title>
<style>
  /* MET-DS-V2 tokens */
  :root {
    --color-brand-primary: #3276CF;
    --color-brand-deep:    #1F3C88;
    --color-brand-cyan:    #03A9F4;
    --color-brand-aqua:    #56AAC4;
    --color-page-bg:       #F2F5FA;
    --color-card-bg:       #FFFFFF;
    --color-text-body:     #212121;
    --color-text-muted:    #5B6B82;
    --radius-pill:         100px;
    --radius-card:         8px;
    --space-2:  2px;  --space-4: 4px;  --space-8: 8px;
    --space-12: 12px; --space-16: 16px; --space-20: 20px;
    --space-24: 24px; --space-32: 32px; --space-40: 40px; --space-48: 48px;
    --font-base: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: var(--font-base);
    color: var(--color-text-body);
    background: var(--color-page-bg);
  }

  /* Subtle animated gradient backdrop */
  body {
    background:
      radial-gradient(1200px 600px at 20% 20%, rgba(50, 118, 207, 0.10), transparent 60%),
      radial-gradient(900px 500px at 80% 80%, rgba(3, 169, 244, 0.10), transparent 60%),
      var(--color-page-bg);
  }

  .loader {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: var(--space-32);
    padding: var(--space-32);
  }

  /* Wordmark — scales the source 76x33 viewBox up */
  .wordmark {
    width: min(128px, 70vw);
    height: auto;
    display: block;
    overflow: visible;
  }

  /* Each letter group animates in sequence (character-by-character) */
  .wordmark .letter {
    opacity: 0;
    transform-box: fill-box;
    transform-origin: center bottom;
    animation: letterIn 700ms cubic-bezier(0.22, 1, 0.36, 1) forwards,
               letterBob 2.2s ease-in-out infinite;
  }

  /* Stagger per letter */
  .wordmark .letter-F { animation-delay: 0ms,    900ms; }
  .wordmark .letter-I { animation-delay: 140ms,  1040ms; }
  .wordmark .letter-O { animation-delay: 280ms,  1180ms; }
  .wordmark .letter-N { animation-delay: 420ms,  1320ms; }
  .wordmark .letter-A { animation-delay: 560ms,  1460ms; }

  @keyframes letterIn {
    0%   { opacity: 0; transform: translateY(18px) scale(0.6); }
    60%  { opacity: 1; transform: translateY(-4px) scale(1.06); }
    100% { opacity: 1; transform: translateY(0)    scale(1); }
  }

  @keyframes letterBob {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-6px); }
  }

  /* Tagline */
  .tagline {
    text-align: center;
    color: var(--color-text-muted);
    font-size: 16px;
    letter-spacing: 0.2px;
    opacity: 0;
    animation: fadeIn 600ms ease-out 800ms forwards;
  }

  .tagline strong {
    color: var(--color-brand-deep);
    font-weight: 600;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Progress bar */
  .progress {
    width: min(320px, 70vw);
    height: 6px;
    background: rgba(31, 60, 136, 0.10);
    border-radius: var(--radius-pill);
    overflow: hidden;
    position: relative;
    opacity: 0;
    animation: fadeIn 600ms ease-out 1000ms forwards;
  }

  .progress::before {
    content: "";
    position: absolute;
    inset: 0;
    width: 40%;
    background: linear-gradient(90deg,
      var(--color-brand-primary),
      var(--color-brand-cyan),
      var(--color-brand-primary));
    border-radius: var(--radius-pill);
    animation: slide 1.6s ease-in-out infinite;
  }

  @keyframes slide {
    0%   { left: -45%; }
    100% { left: 105%; }
  }

  /* Loading dots */
  .dots { display: inline-flex; gap: 4px; margin-left: 4px; vertical-align: middle; }
  .dots span {
    width: 4px; height: 4px; border-radius: 50%;
    background: var(--color-brand-primary);
    animation: dot 1.2s ease-in-out infinite;
  }
  .dots span:nth-child(2) { animation-delay: 0.2s; }
  .dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes dot {
    0%, 80%, 100% { opacity: 0.25; transform: translateY(0); }
    40%           { opacity: 1;    transform: translateY(-3px); }
  }

  /* Footer credit */
  .footer {
    position: fixed;
    bottom: var(--space-16);
    left: 0; right: 0;
    text-align: center;
    color: var(--color-text-muted);
    font-size: 12px;
    opacity: 0.8;
  }

  /* Accessibility — respect reduced motion */
  @media (prefers-reduced-motion: reduce) {
    .wordmark .letter,
    .progress::before,
    .dots span,
    .tagline,
    .progress {
      animation: none !important;
      opacity: 1 !important;
      transform: none !important;
    }
    .progress::before { width: 60%; left: 20%; }
  }
</style>
